name: PR Build

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

jobs:
  # Runs the full suite, including the Testcontainers round-trip test — the
  # ubuntu-latest runner has Docker available.
  test:
    uses: ./.github/workflows/maven-test.yml

  # Packages the jar the PR would produce and attaches it to the run, so a
  # reviewer can drop it into a consuming service without merging first.
  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Resolve or reserve PR version
        id: version
        env:
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          git fetch --tags
          EXISTING=$(git tag --list "pr-${PR_NUM}-*" | head -1)
          if [ -n "$EXISTING" ]; then
            VERSION=$(echo "$EXISTING" | sed "s/pr-${PR_NUM}-//")
          else
            VERSION=$(python3 <<'PYEOF'
          import subprocess, re
          tags_out = subprocess.check_output(['git', 'tag'], text=True).strip()
          tags = [t for t in tags_out.split('\n') if t]
          versions = []
          for tag in tags:
              m = re.match(r'^(\d+)\.(\d+)\.(\d+)$', tag)
              if m:
                  versions.append(tuple(int(x) for x in m.groups()))
              m = re.match(r'^pr-\d+-(\d+)\.(\d+)\.(\d+)$', tag)
              if m:
                  versions.append(tuple(int(x) for x in m.groups()))
          if versions:
              latest = max(versions)
              print(f'{latest[0]}.{latest[1]}.{latest[2]+1}')
          else:
              print('0.0.1')
          PYEOF
          )
          fi
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image-tag=${VERSION}-pr${PR_NUM}-${SHORT_SHA}-SNAPSHOT" >> "$GITHUB_OUTPUT"        

      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          server-id: reposilite-snapshots
          server-username: REPOSILITE_USER      # env var *names*, not values
          server-password: REPOSILITE_TOKEN

      - name: Deploy versioned jar
        env:
          REPOSILITE_USER: ${{ secrets.REPOSILITE_USER }}
          REPOSILITE_TOKEN: ${{ secrets.REPOSILITE_TOKEN }}
        run: |
          mvn --batch-mode versions:set -DnewVersion=${{ steps.version.outputs.image-tag }}
          mvn --batch-mode -DskipTests deploy
