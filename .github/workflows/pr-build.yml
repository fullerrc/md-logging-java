name: PR Build

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

jobs:
  # Runs the full suite, including the Testcontainers round-trip test — the
  # ubuntu-latest runner has Docker available.
  test:
    uses: ./.github/workflows/maven-test.yml

  # Packages the jar the PR would produce and attaches it to the run, so a
  # reviewer can drop it into a consuming service without merging first.
  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Package
        run: mvn --batch-mode -DskipTests package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: md-logging-java-pr${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: target/md-logging-java-*.jar
          retention-days: 14
