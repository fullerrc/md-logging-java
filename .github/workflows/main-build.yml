name: Main Build

on:
  push:
    branches: [master]
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/maven-test.yml

  # Versioning matches the other MediaDroppy services: scan X.Y.Z tags, take the
  # highest, increment the patch. The tag is only pushed after the versioned jar
  # builds, so an X.Y.Z tag always corresponds to a published artifact.
  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          git fetch --tags
          VERSION=$(python3 <<'PYEOF'
          import subprocess, re
          tags_out = subprocess.check_output(['git', 'tag'], text=True).strip()
          tags = [t for t in tags_out.split('\n') if t]
          versions = []
          for tag in tags:
              m = re.match(r'^(\d+)\.(\d+)\.(\d+)$', tag)
              if m:
                  versions.append(tuple(int(x) for x in m.groups()))
          if versions:
              latest = max(versions)
              print(f'{latest[0]}.{latest[1]}.{latest[2]+1}')
          else:
              print('0.0.1')
          PYEOF
          )
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          server-id: reposilite-releases
          server-username: REPOSILITE_USER      # env var *names*, not values
          server-password: REPOSILITE_TOKEN

      - name: Deploy versioned jar
        env:
          REPOSILITE_USER: ${{ secrets.REPOSILITE_USER }}
          REPOSILITE_TOKEN: ${{ secrets.REPOSILITE_TOKEN }}
        run: |
          mvn --batch-mode versions:set -DnewVersion=${{ steps.version.outputs.version }}
          mvn --batch-mode -DskipTests deploy

      - name: Tag commit with build version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"
